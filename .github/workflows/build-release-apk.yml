name: Build signed DiPlay release APK

# 针对仓库: tbaip/DiPlay-Legacy-Android (fork 后放入 .github/workflows/ 即可)
# 方案: 临时替换 mobile/build.gradle.kts 中 verifyReleaseSigningIdentity 守卫的
#       官方证书指纹常量为自己的指纹, 并提供 ANDROID_KEY* 环境变量,
#       由 Gradle 的 signingConfigs.release 直接用我们的 keystore 签名 release 包。
#       补丁只在 runner 内生效, 不提交到仓库。
#
# 触发方式:
#   1. 手动: Actions -> Build signed DiPlay release APK -> Run workflow
#   2. 自动: 推送 v* 标签 (git tag v0.2.69 && git push --tags)
#
# 必需 Secrets (Settings -> Secrets and variables -> Actions -> Repository secrets,
#               不要放在 Environments 区!):
#   KEYSTORE_B64           正式 keystore 的 base64 (生成: base64 -w0 release.keystore)
#   KEYSTORE_PASSWORD      keystore 密码
#   KEY_ALIAS              key 别名
#   KEY_PASSWORD           key 密码 (与 keystore 密码相同时可省略)
#   MFI_IDENTITY_PK8_B64   CarPlay MFi 身份私钥 base64 (assets/offline-mfi/identity.pk8)
#   MFI_CERTIFICATE_P7B_B64 CarPlay MFi 证书 base64 (assets/offline-mfi/certificate.p7b)
#   (MFi 两项缺失时会自动尝试从官方 release / 社区 v0.2.68 测试包兜底提取)
#
# 注意: 未配置 keystore Secrets 时会自动生成一把临时密钥来签名(仅适合测试)。
#       临时密钥与官方包签名不同, 覆盖安装会报"签名不一致", 需先卸载旧版。

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "尝试从中提取 MFi 身份的上游 release tag (其仓库已404, 建议改用 Secrets)"
        required: false
        default: "v0.2.64"
      version_name:
        description: "APK 文件名中的版本号, 如 v0.2.69; 留空则自动推断"
        required: false
        default: ""
      apply_micfix_patch:
        description: "应用音频防抖补丁 (patches/apply_audio_mode_debounce.py)"
        type: boolean
        required: false
        default: false
      create_github_release:
        description: "将 APK 发布到本仓库 Releases 页面"
        type: boolean
        required: false
        default: true
  push:
    tags: [ "v*" ]

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleStandaloneRelease (Gradle signed)
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Android SDK + NDK 体积大, 先腾出磁盘空间
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # docs/BUILD.md 要求 JDK 25
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # runner 镜像已预装 Android SDK, 直接探测并复用
      - name: Configure Android SDK
        run: |
          set -euo pipefail
          SDK=""
          for c in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" /usr/local/lib/android/sdk; do
            if [ -n "$c" ] && [ -d "$c" ]; then SDK="$c"; break; fi
          done
          if [ -z "$SDK" ]; then
            echo "::error::未找到 Android SDK"
            exit 1
          fi
          echo "使用 SDK: $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          BT="$(ls -d "$SDK"/build-tools/*/ 2>/dev/null | sort -V | tail -1)"
          echo "BUILD_TOOLS_DIR=$BT" >> "$GITHUB_ENV"
          echo "build-tools: $BT"

      # 与 shared/build.gradle 的 ndkVersion = '25.2.9519653' 保持一致
      - name: Install SDK packages
        run: |
          set -euo pipefail
          # 部分镜像未把 sdkmanager 放进 PATH, 先在 SDK 目录里定位
          SM="$(find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager 2>/dev/null | head -1)"
          if [ -z "$SM" ]; then
            echo "::warning::SDK 目录中没有 sdkmanager, 下载官方 cmdline-tools"
            curl -fsSL -o /tmp/clt.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            unzip -q /tmp/clt.zip -d "$ANDROID_HOME/cmdline-tools"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            SM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager: $SM"
          echo "$(dirname "$SM")" >> "$GITHUB_PATH"
          # 接受许可; yes 因下游关闭管道产生的 Broken pipe 属预期, 已用 || true 兜住
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;25.2.9519653"
          ls "$ANDROID_HOME/ndk/"

      # 可选: micfix 音频补丁
      - name: Apply micfix patch
        if: ${{ inputs.apply_micfix_patch == true }}
        run: python3 patches/apply_audio_mode_debounce.py

      # shared 模块的原生构建会硬校验 libopus / lwIP 源码是否就位,
      # 上游挂接缺陷导致它们不会被自动触发, 必须手动准备
      - name: Fetch pinned native sources (libopus + lwIP)
        run: |
          set -euo pipefail
          python3 scripts/prepare-libopus.py
          python3 scripts/prepare-lwip.py
          test -f shared/src/main/jni/libopus/opus_sources.mk || { echo "::error::libopus 源码缺失"; exit 1; }
          test -f shared/src/main/jni/lwip/src/include/lwip/opt.h || { echo "::error::lwIP 源码缺失"; exit 1; }

      # CarPlay 认证材料, 优先级:
      #   1. 仓库级 Secrets (MFI_IDENTITY_PK8_B64 / MFI_CERTIFICATE_P7B_B64) -- 推荐
      #      注意: 必须放在 Settings -> Secrets and variables -> Actions 的
      #      "Repository secrets" 区, 而不是 Environments 区!
      #      Environment secrets 对未声明 environment 的 job 不可见。
      #   2. 从 upstream_tag 指定的官方 release APK 提取 (官方仓库已 404, 大概率失败)
      #   3. 兜底: 从仍在线的社区 v0.2.68 测试包中提取 (含 MFi 身份)
      #   都失败才跳过: APK 可正常安装, 但 CarPlay 无法连接 iPhone
      - name: Prepare MFi auth assets
        env:
          MFI_IDENTITY_PK8_B64: ${{ secrets.MFI_IDENTITY_PK8_B64 }}
          MFI_CERTIFICATE_P7B_B64: ${{ secrets.MFI_CERTIFICATE_P7B_B64 }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag || 'v0.2.64' }}
        run: |
          set -uo pipefail
          mkdir -p auth-assets/offline-mfi
          SRC=""
          if [ -n "$MFI_IDENTITY_PK8_B64" ] && [ -n "$MFI_CERTIFICATE_P7B_B64" ]; then
            echo "$MFI_IDENTITY_PK8_B64" | base64 -d > auth-assets/offline-mfi/identity.pk8
            echo "$MFI_CERTIFICATE_P7B_B64" | base64 -d > auth-assets/offline-mfi/certificate.p7b
            echo "已从 Secrets 加载 MFi 身份文件"
          else
            # 来源 A: 官方 upstream tag (可能已 404)
            URL_A="https://github.com/programmerguohuajing/DiPlay-Legacy-Android/releases/download/${UPSTREAM_TAG}/DiPlay-${UPSTREAM_TAG}-legacy-release.apk"
            echo "尝试来源 A (官方 release): $URL_A"
            if curl -fsSL --retry 2 --retry-delay 2 -o /tmp/src.apk "$URL_A"; then
              SRC="/tmp/src.apk"
            else
              echo "::warning::官方 release 不可用(404), 改试社区兜底源"
            fi
            # 来源 B: 仍在线的社区 v0.2.68 测试包 (经 GitHub API 下载)
            if [ -z "$SRC" ]; then
              URL_B="https://api.github.com/repos/Ray-Hx/DiPlay-Legacy-Android4.4/releases/assets/709877093"
              echo "尝试来源 B (社区 v0.2.68 测试包): $URL_B"
              if curl -fsSL --retry 2 --retry-delay 2 \
                   -H "Accept: application/octet-stream" \
                   -o /tmp/src.apk "$URL_B"; then
                SRC="/tmp/src.apk"
              else
                echo "::warning::社区兜底源也下载失败"
              fi
            fi
            if [ -n "$SRC" ]; then
              unzip -p "$SRC" assets/offline-mfi/identity.pk8 > auth-assets/offline-mfi/identity.pk8
              unzip -p "$SRC" assets/offline-mfi/certificate.p7b > auth-assets/offline-mfi/certificate.p7b
              echo "已从 APK 提取 MFi 身份文件: $SRC"
              rm -f /tmp/src.apk
            fi
          fi
          if [ -s auth-assets/offline-mfi/identity.pk8 ] && [ -s auth-assets/offline-mfi/certificate.p7b ]; then
            ls -l auth-assets/offline-mfi/
            # 只在真正有身份文件时才设置该变量:
            # Gradle 侧对"变量存在但为空"会报 Cannot convert '' to File
            echo "DIPLAY_AUTH_ASSETS_DIR=${{ github.workspace }}/auth-assets" >> "$GITHUB_ENV"
          else
            echo "::warning::未获得 MFi 身份文件, CarPlay 认证功能不可用"
          fi

      # mobile/build.gradle.kts 注册了 verifyReleaseSigningIdentity 守卫:
      #   1) 要求 ANDROID_KEYSTORE_PATH / ANDROID_KEYSTORE_PASSWORD /
      #      ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD 四个变量齐全且 keystore 可打开
      #   2) 硬编码校验证书 SHA-256 指纹 == 官方 v0.2.21 证书 (bca015c0...)
      # 自签 keystore 不可能通过 (2), 因此在 CI 里临时把该常量换成自己证书的指纹,
      # 让 Gradle 直接用我们的 keystore 签名 release 包。此改动只在 runner 内生效, 不提交。
      - name: Prepare signing key and patch release guard
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/signing
          KS=/tmp/signing/release.keystore
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            ALIAS="$KS_ALIAS"
            STORE_PASS="$KS_PASSWORD"
            KEY_PASS="${KEY_PASSWORD:-$KS_PASSWORD}"
            echo "使用仓库 Secrets 中的正式 keystore"
          else
            PASS="$(openssl rand -hex 16)"
            ALIAS="diplay-ci"
            keytool -genkeypair -v \
              -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=DiPlay CI, OU=CI, O=DiPlay-Legacy"
            STORE_PASS="$PASS"
            KEY_PASS="$PASS"
            echo "::warning::未配置 KEYSTORE_B64, 已生成临时密钥; 后续升级必须保留同一把钥匙"
          fi
          [ -n "$ALIAS" ] || { echo "::error::KEY_ALIAS 为空"; exit 1; }
          [ -s "$KS" ] || { echo "::error::keystore 文件为空"; exit 1; }

          # 证书 DER 的 SHA-256, 与 gradle 侧 MessageDigest.digest(cert.encoded) 一致
          FP="$(keytool -exportcert -alias "$ALIAS" -keystore "$KS" \
                  -storepass "$STORE_PASS" | openssl dgst -sha256 | awk '{print $NF}')"
          [[ "$FP" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::证书指纹计算失败: $FP"; exit 1; }
          echo "本密钥证书 SHA-256: $FP"

          # 把 build.gradle.kts 中指纹校验常量替换为自己的指纹 (兼容上游改过常量值)
          python3 - "$FP" <<'PY'
          import re, sys, pathlib
          fp = sys.argv[1]
          p = pathlib.Path("mobile/build.gradle.kts")
          s = p.read_text()
          new, n = re.subn(
              r'(fingerprint\.equals\(")[0-9a-fA-F]{64}(")',
              lambda m: m.group(1) + fp + m.group(2),
              s,
          )
          if n == 0:
              raise SystemExit("::error::未找到证书指纹校验代码, 上游结构可能已变化")
          p.write_text(new)
          print(f"已替换 {n} 处证书指纹常量")
          PY
          grep -n "fingerprint.equals" mobile/build.gradle.kts

          # 供 Gradle 的 signingConfigs.release 与 verifyReleaseSigningIdentity 读取
          {
            echo "ANDROID_KEYSTORE_PATH=$KS"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
          echo "已写入 ANDROID_KEY* 环境变量"
          ls -l "$KS"

      # 构建 standalone release (Gradle 已用上面的 keystore 直接签名)
      # 注意: 不要在这里显式传 DIPLAY_AUTH_ASSETS_DIR。
      # 上一步通过 GITHUB_ENV 设置的变量会自动对后续步骤生效;
      # 若此处用 ${{ env.* }} 重导出, 未设置时会变成空字符串导致 Gradle 报错
      - name: Build signed release APK
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew :mobile:assembleStandaloneRelease --no-daemon --stacktrace \
            --console=plain > /tmp/build.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "::error::Gradle 退出码 $code"
            sed -n '/What went wrong/,/^\* Try/p' /tmp/build.log | head -45
            grep -n "FAILED" /tmp/build.log | head -25
            grep -n -A 6 "Caused by" /tmp/build.log | head -30
            tail -40 /tmp/build.log
            exit "$code"
          fi
          echo "构建 + 签名成功"
          find mobile/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Resolve version name
        id: ver
        run: |
          if [ -n "${{ inputs.version_name }}" ]; then
            V="${{ inputs.version_name }}"
          elif [ -n "${GITHUB_REF_NAME:-}" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            V="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.upstream_tag }}" ]; then
            V="${{ inputs.upstream_tag }}"
          else
            V="manual-${{ github.run_number }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "使用版本号: $V"

      # Gradle 已完成签名与对齐, 这里只做校验、重命名与校验和
      - name: Verify and finalize APK
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          BT="$BUILD_TOOLS_DIR"
          APK="$(find mobile/build/outputs/apk -name "*.apk" ! -name "*-unsigned*" | head -1)"
          if [ -z "$APK" ]; then
            echo "::error::未找到 release APK"
            find mobile/build/outputs/apk -type f | head -20
            exit 1
          fi
          echo "构建产物: $APK"
          OUT="DiPlay-${VERSION}-legacy-release.apk"
          cp "$APK" "$OUT"
          echo "--- 签名校验 (老车机需 v1 签名为 true) ---"
          "$BT/apksigner" verify --print-certs "$OUT" | head -20
          "$BT/zipalign" -c -p 4 "$OUT" || echo "::warning::zipalign 检查未通过"
          echo "--- 产物 ---"
          ls -lh "$OUT"
          sha256sum "$OUT" | tee "${OUT}.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiPlay-${{ steps.ver.outputs.version }}-legacy-release-apk
          path: |
            DiPlay-*.apk
            DiPlay-*.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish to GitHub Releases
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.create_github_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: DiPlay ${{ steps.ver.outputs.version }} (signed release)
          draft: false
          prerelease: true
          files: |
            DiPlay-*.apk
            DiPlay-*.sha256
